<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Giupi - Nuestra Línea de Tiempo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #020617; min-height: 100vh; margin: 0; padding-bottom: 60px; color: #f1f5f9; overflow-x: hidden; }

        .header-galeria { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 20px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-volver { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: none; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; text-decoration: none; }
        .titulo-header { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: #00d2ff; margin: 0; }

        .contenedor-timeline { padding: 20px; display: flex; flex-direction: column; gap: 35px; position: relative; }
        .contenedor-timeline::before { content: ''; position: absolute; left: 30px; top: 40px; bottom: 20px; width: 2px; background: linear-gradient(to bottom, #00d2ff, #fbbf24, rgba(255,255,255,0.05)); opacity: 0.3; }

        .hito-timeline { display: flex; gap: 20px; position: relative; animation: tarjetaEntrada 0.5s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes tarjetaEntrada { to { opacity: 1; transform: translateY(0); } }

        .burbuja-fecha { min-width: 22px; height: 22px; background: #00d2ff; border-radius: 50%; border: 4px solid #020617; box-shadow: 0 0 10px #00d2ff; margin-top: 5px; z-index: 5; }
        .hito-timeline:nth-child(even) .burbuja-fecha { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }

        .tarjeta-recuerdo { 
            flex-grow: 1; background: rgba(15, 23, 42, 0.45); border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 24px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .meta-recuerdo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .fecha-txt { font-size: 0.8rem; font-weight: 700; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.5px; }
        .lugar-txt { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
        
        .mision-titulo { font-size: 0.95rem; font-weight: 600; color: #f1f5f9; margin: 0 0 12px 0; line-height: 1.3; }

        .galeria-fotos { display: flex; gap: 15px; justify-content: flex-start; margin: 15px 0; height: 150px; }
        .polaroid-mini { 
            background: #f8fafc; padding: 6px 6px 18px 6px; width: 110px; height: 140px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4); border-radius: 2px; cursor: pointer;
            position: relative; transition: transform 0.2s;
        }
        .polaroid-mini:active { transform: scale(0.95); }
        .polaroid-mini img { width: 100%; height: 100%; object-fit: cover; border: 1px solid #cbd5e1; }
        
        .nota-txt { font-family: 'Dancing Script', cursive; font-size: 1.3rem; color: #00d2ff; margin: 8px 0 0 0; line-height: 1.2; white-space: pre-line; border-top: 1px dashed rgba(255,255,255,0.08); padding-top: 10px; }

        .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: cargaEsqueleto 1.5s infinite linear; border: none !important; }
        @keyframes cargaEsqueleto { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .visor-galeria { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; cursor: pointer; }
        .img-visor { max-width: 95%; max-height: 85%; border-radius: 8px; border: 2px solid #fbbf24; }
        
        .estado-vacio { text-align: center; padding: 60px 20px; color: #64748b; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="header-galeria">
        <a href="muro.html" class="btn-volver">←</a>
        <h1 class="titulo-header">Nuestra Historia</h1>
        <div></div> 
    </header>

    <main class="contenedor-timeline" id="timeline-principal">
        <div class="hito-timeline" id="load-skeleton-1" style="opacity: 1; transform:none;">
            <div class="burbuja-fecha"></div>
            <div class="tarjeta-recuerdo skeleton" style="height: 180px;"></div>
        </div>
    </main>

    <div class="visor-galeria" id="visor-g" onclick="this.style.display='none'">
        <img src="" class="img-visor" id="img-v">
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const contenedor = document.getElementById('timeline-principal');

        async function cargarLineaTiempo() {
            try {
                const q = query(collection(db, "recuerdos"), orderBy("fecha", "desc"));
                const querySnapshot = await getDocs(q);

                contenedor.innerHTML = "";

                if (querySnapshot.empty) {
                    contenedor.innerHTML = `<div class="estado-vacio">✨ Tu álbum está listo para ser llenado.<br>¡Añadan su primera foto juntos! 🤍</div>`;
                    return;
                }

                let retrasoAnimacion = 0;

                querySnapshot.forEach((doc) => {
                    const datos = doc.data();
                    
                    // MODIFICACIÓN: Mostrar tarjeta si hay al menos un dato relevante (foto, nota o lugar)
                    if (datos.foto1 || datos.foto2 || datos.nota || datos.lugar) {
                        let htmlFotos = "";
                        
                        // MODIFICACIÓN: Añadido onerror para ocultar el marco si la URL de ImgBB falla
                        if (datos.foto1) {
                            htmlFotos += `<div class="polaroid-mini" onclick="window.ampliarFoto('${datos.foto1}')"><img src="${datos.foto1}" onerror="this.style.display='none'; this.parentElement.style.display='none';"></div>`;
                        }
                        if (datos.foto2) {
                            htmlFotos += `<div class="polaroid-mini" onclick="window.ampliarFoto('${datos.foto2}')" style="transform: rotate(3deg);"><img src="${datos.foto2}" onerror="this.style.display='none'; this.parentElement.style.display='none';"></div>`;
                        }

                        contenedor.innerHTML += `
                            <div class="hito-timeline" style="animation-delay: ${retrasoAnimacion}s">
                                <div class="burbuja-fecha"></div>
                                <div class="tarjeta-recuerdo">
                                    <div class="meta-recuerdo">
                                        <span class="fecha-txt">🗓️ ${datos.fechaTexto || 'Fecha mágica'}</span>
                                        <span class="lugar-txt">📍 ${datos.lugar || 'En algún lugar'}</span>
                                    </div>
                                    <h3 class="mision-titulo">${datos.misiones || datos.mision || 'Cita Lograda'}</h3>
                                    <div class="galeria-fotos">${htmlFotos}</div>
                                    <p class="nota-txt">${datos.nota || ''}</p>
                                </div>
                            </div>
                        `;
                        retrasoAnimacion += 0.15; 
                    }
                });

                if(contenedor.innerHTML === "") {
                    contenedor.innerHTML = `<div class="estado-vacio">✨ Aún no hay recuerdos para mostrar aquí.</div>`;
                }

            } catch (error) {
                console.error("Error cargando galería:", error);
                contenedor.innerHTML = `<div class="estado-vacio">❌ Ocurrió un error al conectar con Firebase.</div>`;
            }
        }

        window.ampliarFoto = function(url) {
            document.getElementById('img-v').src = url;
            document.getElementById('visor-g').style.display = 'flex';
        };

        cargarLineaTiempo();
    </script>
</body>
</html>
