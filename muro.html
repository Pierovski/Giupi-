<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Giupi - Nuestro Muro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        img { -webkit-user-drag: none; -webkit-touch-callout: none; }
        
        body { background: #020617; min-height: 100vh; padding: 40px 0 80px; margin: 0; overflow-x: hidden; }

        #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #020617; z-index: 10000; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s ease; }
        .splash-logo { color: #fbbf24; font-family: 'Cinzel', serif; font-size: 3.5rem; letter-spacing: 6px; text-shadow: 0 0 30px rgba(251, 191, 36, 0.5); animation: pulso-luz 1.5s infinite alternate; }
        @keyframes pulso-luz { 0% { transform: scale(0.95); opacity: 0.6; } 100% { transform: scale(1.05); opacity: 1; } }
        
        #page-transition { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.4s ease; }

        .panel-cajones { display: flex; flex-direction: column; gap: 15px; padding: 0 20px; margin-top: 15px; }
        
        /* BOTÓN DE SORPRESA */
        .btn-regalo-especial {
            background: linear-gradient(135deg, #fbbf24, #d97706); border: none; padding: 18px; border-radius: 20px;
            color: #020617; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.4); cursor: pointer; text-align: center;
            animation: pulso-oro 2s infinite; text-decoration: none; display: block; margin-bottom: 10px;
        }
        .btn-regalo-especial:active { transform: scale(0.96); }
        @keyframes pulso-oro { 0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.8); } 70% { box-shadow: 0 0 0 15px rgba(251, 191, 36, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); } }

        .cajon-premium { background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.3)); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-decoration: none; transition: transform 0.2s; }
        .cajon-premium:active { transform: scale(0.95); background: rgba(15, 23, 42, 0.8); }
        .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .cajon-premium h3 { font-size: 0.8rem; font-weight: 700; margin: 0; color: #f1f5f9; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .cajon-secreto { flex-direction: row; padding: 18px; margin-top: 5px; background: rgba(0, 0, 0, 0.6); border: 1px dashed rgba(255, 255, 255, 0.15); transition: all 0.5s ease; }
        .cajon-secreto.bloqueado { filter: grayscale(100%); cursor: not-allowed; color: #64748b; }
        .cajon-secreto.desbloqueado { background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(15, 23, 42, 0.8)); border: 1px solid rgba(139, 92, 246, 0.5); filter: grayscale(0%); cursor: pointer; }
        .cajon-secreto.desbloqueado h3 { color: #c4b5fd; }
        
        .btn-random { margin-top: 10px; background: linear-gradient(135deg, rgba(251, 191, 36, 0.03), rgba(0, 210, 255, 0.03)); border: 1px dashed rgba(251, 191, 36, 0.25); border-radius: 20px; padding: 18px; text-align: center; color: #fbbf24; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
        .btn-random:active { transform: scale(0.96); }
        
        .contenedor-progreso { margin-top: 25px; padding: 20px; background: rgba(15, 23, 42, 0.35); border-radius: 24px; border: 1px solid rgba(255,255,255,0.04); }
        .texto-progreso { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .label-progreso { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
        .num-progreso { color: #00d2ff; font-weight: 700; font-size: 0.9rem; }
        .barra-fondo { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.06); border-radius: 10px; position: relative; }
        .barra-llena { height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff, #fbbf24); border-radius: 10px; transition: width 1.5s; position: relative; }
        .giupi-corredor { position: absolute; right: -15px; top: -12px; width: 32px; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); animation: flotar-suave 2s infinite ease-in-out; }
        
        .btn-flotante-galeria { position: fixed; bottom: 25px; right: 25px; width: 45px; height: 45px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(251, 191, 36, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; z-index: 1000; }
        
        @keyframes flotar-suave { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .img-cat { width: 85%; max-height: 90px; object-fit: contain; animation: flotar-suave 3s ease-in-out infinite; }
    </style>
</head>
<body>
    
    <div id="splash-screen">
        <h1 class="splash-logo">GIUPI</h1>
    </div>
    <div id="page-transition"></div>

    <main class="panel-cajones">
        
        <!-- BOTÓN DE SORPRESA DIRECTO -->
        <a href="sorpresa.html" class="btn-regalo-especial">🎁 ABRIR REGALO</a>

        <div class="grid-2x2">
            <a href="categoria.html?cat=distancia" class="cajon-premium"><img src="giupi-viajero.png" alt="Distancia" class="img-cat"><h3>A DISTANCIA</h3></a>
            <a href="categoria.html?cat=reencuentro" class="cajon-premium"><img src="giupi-elegante.png" alt="Reencuentro" class="img-cat"><h3>REENCUENTRO</h3></a>
            <a href="categoria.html?cat=casa" class="cajon-premium"><img src="giupi-chef.png" alt="En Casa" class="img-cat"><h3>EN CASA</h3></a>
            <a href="categoria.html?cat=airelibre" class="cajon-premium"><img src="giupi-explorador.png" alt="Aire Libre" class="img-cat"><h3>AIRE LIBRE</h3></a>
        </div>

        <a href="#" id="cajon-secreto" class="cajon-premium cajon-secreto bloqueado">
            <div class="candado-icono" id="icono-secreto">🔒</div>
            <h3 id="texto-secreto" style="margin-left: 15px;">NIVEL SECRETO<br><span style="font-size: 0.6rem; opacity: 0.7;">Desbloqueo a los 50 recuerdos</span></h3>
        </a>

        <div class="contenedor-progreso">
            <div class="texto-progreso">
                <span class="label-progreso">Nuestra Historia</span>
                <span class="num-progreso" id="contador-progreso">0 / 100</span>
            </div>
            <div class="barra-fondo">
                <div class="barra-llena" id="barra-progreso"><img src="giupi.png" class="giupi-corredor" alt="Giupi Tracker"></div>
            </div>
        </div>

        <div class="btn-random" id="btn-revivir">✨ REVIVIR UN INSTANTE ALEATORIO</div>
    </main>

    <div class="btn-flotante-galeria" onclick="window.location.href='galeria.html'">📸</div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 800);
            }, 1000);
        });

        let misionesCompletadas = [];
        const categorias = ['distancia', 'reencuentro', 'casa', 'airelibre', 'secreta'];
        let totalCompletadas = 0;

        categorias.forEach(cat => {
            const volteadas = JSON.parse(localStorage.getItem('misiones_' + cat)) || [];
            totalCompletadas += volteadas.length;
        });

        setTimeout(() => {
            const porcentaje = Math.min((totalCompletadas / 100) * 100, 100);
            document.getElementById('barra-progreso').style.width = porcentaje + '%';
            document.getElementById('contador-progreso').innerText = totalCompletadas + " / 100";
        }, 300);
    </script>
</body>
</html>
